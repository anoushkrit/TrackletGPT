optimizer: { type: AdamW, kwargs: { lr: 0.0001, weight_decay: 0.05 } }

scheduler: { type: CosLR, kwargs: { epochs: 300, initial_epochs: 10 } }

dataset:
  {
    train:
      {
        _base_: cfgs/dataset_configs/tracklet_sentence.yaml,
        others: { subset: "train", npoints: 256 },
      },
    val:
      {
        _base_: cfgs/dataset_configs/tracklet_sentence.yaml,
        others: { subset: "val", npoints: 256 },
      },
    test:
      {
        _base_: cfgs/dataset_configs/tracklet_sentence.yaml,
        others: { subset: "test", npoints: 256 },
      },
  }

model:
  {
    NAME: TractoGPT,
    cls_dim: 32,
    group_size: 12,
    num_group: 256,
    is_tracklet: True,
    streamline_patch: False,
    loss: cdl12,
    weight_center: 1,
    keep_attend: 7,
    transformer_config:
      {
        mask_ratio: 0.7,
        mask_type: "rand",
        trans_dim: 128,
        encoder_dims: 128,
        depth: 6,
        drop_path_rate: 0.1,
        num_heads: 4,
        decoder_depth: 3,
        decoder_num_heads: 4,
      },
  }

npoints: 256
total_bs: 128  # bs==1 when using custom batch created using dataloader
step_per_update: 1
max_epoch: 300
