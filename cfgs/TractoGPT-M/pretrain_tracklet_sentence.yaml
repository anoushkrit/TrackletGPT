optimizer: { type: AdamW, kwargs: { lr: 0.0001, weight_decay: 0.05 } }

scheduler: { type: CosLR, kwargs: { epochs: 300, initial_epochs: 10 } }

dataset:
  {
    train:
      {
        _base_: cfgs/dataset_configs/tracklet.yaml,
        others: { subset: "trainset", npoints: 256 },
      },
    val:
      {
        _base_: cfgs/dataset_configs/tracklet.yaml,
        others: { subset: "validset", npoints: 256 },
      },
    test:
      {
        _base_: cfgs/dataset_configs/tracklet.yaml,
        others: { subset: "testset", npoints: 256 },
      },
  }

model:
  {
    NAME: TractoGPT,
    cls_dim: 32,
    group_size: 12,
    num_group: 32,
    loss: cdl12,
    weight_center: 1,
    keep_attend: 7,
    transformer_config:
      {
        mask_ratio: 0.7,
        mask_type: "rand",
        trans_dim: 256,
        encoder_dims: 256,
        depth: 8,
        drop_path_rate: 0.1,
        num_heads: 4,
        decoder_depth: 4,
        decoder_num_heads: 4,
      },
    is_tracklet: True,
  }

npoints: 256
total_bs: 512  # bs==1 when using custom batch created using dataloader
step_per_update: 1
max_epoch: 300
