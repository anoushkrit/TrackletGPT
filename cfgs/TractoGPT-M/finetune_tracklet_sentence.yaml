optimizer: { type: AdamW, kwargs: { lr: 0.0001, weight_decay: 0.05 } }

scheduler: { type: CosLR, kwargs: { epochs: 300, initial_epochs: 30 } }

dataset:
  {
    train:
      {
        _base_: cfgs/dataset_configs/tracklet_sentence.yaml,
        others: { subset: "train" },
      },
    val:
      {
        _base_: cfgs/dataset_configs/tracklet_sentence.yaml,
        others: { subset: "val" },
      },
    test:
      {
        _base_: cfgs/dataset_configs/tracklet_sentence.yaml,
        others: { subset: "test" },
      },
  }
model:
  {
    NAME: PointTransformer,
    trans_dim: 256,
    depth: 9,
    drop_path_rate: 0.1,
    cls_dim: 71,
    num_heads: 4,
    group_size: 12,
    num_group: 256,
    encoder_dims: 256,
    decoder_depth: 4,
    is_tracklet: True,
    streamline_patch: False,
    triplet_loss: False,
  }

npoints: 256 # will not be considered with Tracklet Mode
total_bs: 128
step_per_update: 1
max_epoch: 300
grad_norm_clip: 10
